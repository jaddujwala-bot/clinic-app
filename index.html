<div class="app"><aside class="side"><div class="brand"><div class="logo"><img src="/logo.jpeg" alt="Mahaveer Logo"></div><div><h1 id="clinicName">Medicos</h1><small>CMS</small></div></div><div class="section-label">CMS Module</div><nav class="nav" id="cmsNav"></nav><div class="section-label">Pharmacy Module</div><nav class="nav" id="pharmacyNav"></nav></aside><main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Clinic overview and upcoming OPD appointments.</p></div><div class="userbar"><div class="tag" id="todayTag"></div><div class="tag" id="userTag">Not logged in</div><button class="btn gray no-print" onclick="logout()">Logout</button></div></div><section id="content"></section></main></div>
<div class="login-screen" id="loginScreen"><canvas id="loginParticles"></canvas><div class="login-orb login-orb-one"></div><div class="login-orb login-orb-two"></div><div class="login-grid-floor"></div><div class="login-wrap"><section class="login-hero"><h1><span>Mahaveer Healthcare</span><br>& Medicos System</h1></section><div class="login-card"><div class="float-logo-wrap"><div class="login-ring"></div><div class="login-ring login-ring-two"></div><div class="float-logo"></div></div><h2>Welcome Back</h2><p class="login-sub">Sign in to continue to Mahaveer Healthcare & Medicos.</p><form id="loginForm"><label>Username<input name="username" required autocomplete="username" placeholder="Enter username"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Enter password"></label><div id="loginError" class="err"></div><button class="login-btn">Login to Application →</button></form></div></div></div>

<script>
const API='/api/';
const state={tab:'dashboard',admin:'employees',report:'daily_opd',phReportType:'Sales Report',phReportEnd:'',phReportData:null,q:'',date:new Date().toISOString().slice(0,10),user:null,regFilters:{},opdFilters:{},apptFilters:{},opdPatientFilters:{},phCustomer:{patient_id:'',registration_no:'',customer_name:'',contact:'',payment_status:'Auto',payment_method:'Cash',payment:0},phEditId:'',phRows:[],stockRows:[],returnRows:[],data:{patients:[],doctors:[],employees:[],departments:[],appointments:[],opd_bills:[],reports:{},pharma_suppliers:[],pharmacy_stock_items:[],pharmacy_invoices:[],pharmacy_returns:[],users:[]}};
const navItems=[['dashboard','Dashboard','Total patients, active doctors, OPD and charts'],['registration','Registration','New patient registration and patient directory'],['billing','OPD Billing','New OPD bills, payments, print invoice/prescription'],['appointments','Appointments','Appointment scheduling and tracking'],['reports','Reports','Daily OPD, doctor-wise, registrations, collections'],['admin','Admin','Employees, doctors, departments and sub-departments'],['pharmacy_dashboard','Pharmacy Dashboard','Revenue, invoices, stock alerts and trends'],['pharmacy_invoice','Create Invoice','Create pharmacy tax invoice'],['pharmacy_returns','Return Invoice','Return requests and refunds'],['pharmacy_sales','Sale Invoice','Sales invoice directory'],['pharmacy_po','Purchase Order','Purchase order status'],['pharmacy_stock_in','Add Stock','Stock inward and supplier invoice'],['pharmacy_inventory','Stock Inventory','Batch-wise medicine stock'],['pharmacy_master','Master Data','Units, HSN, manufacturer, location, suppliers'],['pharmacy_reports','Pharmacy Report','Sales, stock, expiry and GST reports'],['pharmacy_settings','Pharmacy Setting','Pharmacy profile and license details']];
document.getElementById('todayTag').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function badge(s){return `<span class="status ${esc(String(s||'').split(' ')[0])}">${esc(s||'')}</span>`}
function table(head,rows){if(!rows||!rows.length)return '<div class="empty">No records found.</div>';return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function nav(){let allowed=state.user?.tabs||navItems.map(n=>n[0]);let visible=navItems.filter(n=>allowed.includes(n[0]));if(!visible.find(n=>n[0]===state.tab))state.tab=visible[0]?.[0]||'dashboard';let cms=['dashboard','registration','billing','appointments','reports','admin'];let cmsItems=visible.filter(n=>cms.includes(n[0]));let phItems=visible.filter(n=>n[0].startsWith('pharmacy_'));cmsNav.innerHTML=cmsItems.map(n=>`<button class="${state.tab==n[0]?'active':''}" onclick="show('${n[0]}')">${n[1]}</button>`).join('');pharmacyNav.innerHTML=phItems.map(n=>`<button class="${state.tab==n[0]?'active':''}" onclick="show('${n[0]}')">${n[1]}</button>`).join('')}
async function load(){let me=await fetch(API+'me').then(r=>r.json());if(!me.authenticated){showLogin();return}state.user=me.user;hideLogin();let keys=['patients','doctors','appointments','opd_bills','pharmacy_stock_items'];if(state.user.role==='admin')keys=['patients','doctors','employees','departments','appointments','opd_bills','pharma_suppliers','pharmacy_stock_items','pharmacy_invoices','pharmacy_returns','users'];if(state.user.role==='pharmacist')keys=['patients','opd_bills','pharma_suppliers','pharmacy_stock_items','pharmacy_invoices','pharmacy_returns'];if(state.user.role==='doctor')keys=['patients','doctors','appointments','opd_bills','pharmacy_stock_items'];for(const k of keys){let res=await fetch(API+k);state.data[k]=res.ok?await res.json():[]} state.data.reports=await fetch(API+'reports?date='+state.date).then(r=>r.ok?r.json():{}); render();}
function show(tab){state.tab=tab;state.q='';render()}
function setTitle(){let n=navItems.find(x=>x[0]==state.tab);pageTitle.textContent=n[1];pageSub.textContent=n[2]}
function render(){nav();if(userTag&&state.user)userTag.textContent=state.user.full_name+' — '+state.user.role_label;setTitle();({dashboard:renderDashboard,registration:renderRegistration,billing:renderBilling,appointments:renderAppointments,reports:renderReports,admin:renderAdmin,pharmacy_hold:renderPharmacyHold,pharmacy_dashboard:renderPharmacyDashboard,pharmacy_invoice:renderPharmacyInvoice,pharmacy_returns:renderPharmacyReturns,pharmacy_sales:renderPharmacySales,pharmacy_po:renderPharmacyPO,pharmacy_stock_in:renderStockIn,pharmacy_inventory:renderInventory,pharmacy_master:renderPharmacyMaster,pharmacy_reports:renderPharmacyReports,pharmacy_settings:renderPharmacySettings}[state.tab]||renderDashboard)()}
function filter(arr){let q=state.q.toLowerCase();return !q?arr:arr.filter(o=>JSON.stringify(o).toLowerCase().includes(q))}
function searchBar(ph){return `<input class="search" placeholder="${ph}" value="${esc(state.q)}" oninput="state.q=this.value;render()">`}
function renderDashboard(){let r=state.data.reports, g=r.gender_opd||[], male=(g.find(x=>(x.gender||'').toLowerCase()=='male')||{}).count||0, female=(g.find(x=>(x.gender||'').toLowerCase()=='female')||{}).count||0, other=g.reduce((a,x)=>a+(!['male','female'].includes(String(x.gender||'').toLowerCase())?x.count:0),0);content.innerHTML=`
 <div class="cards"><div class="card"><span>Total Registered Patients</span><b>${r.total_patients||0}</b></div><div class="card"><span>Active Doctors</span><b>${r.active_doctors||0}</b></div><div class="card"><span>OPD Bills Today</span><b>${r.opd_today||0}</b></div><div class="card"><span>Appointments Today</span><b>${r.appointments_today||0}</b></div></div>
 <div class="grid2"><div class="panel"><h3>OPD Male / Female Pie Chart</h3>${pieChart(male,female,other)}</div><div class="panel"><h3>Upcoming Appointments</h3>${table(['Date','Time','Reg. No','Patient','Doctor','Status'],(r.upcoming_appointments||[]).map(a=>[esc(a.appt_date),esc(a.appt_time),esc(a.registration_no),esc(a.patient_name),esc(a.doctor_name),badge(a.status)]))}</div></div>
 <div class="panel"><h3>Today Collection Summary</h3><div class="cards"><div class="card"><span>Total Bill</span><b>${money(r.daily_collection?.billed)}</b></div><div class="card"><span>Collected</span><b>${money(r.daily_collection?.collected)}</b></div><div class="card"><span>Balance</span><b>${money(r.daily_collection?.balance)}</b></div><div class="card"><span>Report Date</span><b style="font-size:20px">${esc(r.date)}</b></div></div></div>`}
function pieChart(male,female,other){let total=male+female+other;if(!total)return '<div class="empty">No OPD bills for today yet.</div>';let m=male/total*100,f=female/total*100;return `<div class="chartbox"><div style="width:210px;height:210px;border-radius:50%;background:conic-gradient(#2563eb 0 ${m}%,#ec4899 ${m}% ${m+f}%,#f59e0b ${m+f}% 100%);"></div><div class="legend"><div><span class="dot" style="background:#2563eb"></span>Male: ${male}</div><div><span class="dot" style="background:#ec4899"></span>Female: ${female}</div><div><span class="dot" style="background:#f59e0b"></span>Other/blank: ${other}</div><p class="muted">Based on OPD bills dated ${esc(state.date)}.</p></div></div>`}
const schemas={
 patients:[['__legend','Personal Information'],['name','Patient Name','text',1],['guardian_name','Guardian / Spouse Name','text'],['gender','Gender','select:Male|Female|Other'],['dob','Date of Birth','date'],['age','Age','number'],['blood_group','Blood Group','text'],['category','Patient Category','select:General|Senior Citizen|Staff|Corporate'],['__legend','Contact Details'],['phone','Phone Number','tel',1],['alt_phone','Alternate Phone','tel'],['email','Email','email'],['address','Address','textarea'],['city','City','text'],['__legend','Patient Identity'],['registration_no','Registration No. / UHID','text'],['identity_type','Identity Type','select:Aadhaar|PAN|Voter ID|Passport|Driving Licence|Other'],['identity_no','Identity Number','text'],['allergies','Allergies / Medical Alert','textarea'],['status','Status','select:Active|Inactive']],
 doctors:[['doctor_code','Doctor ID','text'],['name','Doctor Name','text',1],['department_id','Department','department'],['specialization','Specialisation','text',1],['designation','Designation','text'],['phone','Phone','tel'],['email','Email','email'],['address','Address','textarea'],['fee','OPD Fee','number'],['room','Room','text'],['available_days','Available Days','text'],['status','Status','select:Active|Inactive']],
 employees:[['employee_code','Employee ID','text'],['name','Employee Name','text',1],['department_id','Department','department'],['designation','Designation','text'],['phone','Phone','tel'],['email','Email','email'],['address','Address','textarea'],['status','Status','select:Active|Inactive']],
 departments:[['name','Department / Sub Department Name','text',1],['parent_id','Parent Department','parentDepartment'],['module','Module','select:CMS'],['description','Description','textarea'],['status','Status','select:Active|Inactive']],
 appointments:[['patient_id','Registered Patient','patient',1],['doctor_id','Doctor','doctor',1],['appt_date','Appointment Date','date',1],['appt_time','Appointment Time','time',1],['visit_type','Visit Type','select:OPD|Follow-up|Emergency'],['reason','Reason','textarea'],['status','Status','select:Scheduled|Checked In|Completed|Cancelled'],['notes','Notes','textarea']],
 opd_bills:[['patient_id','Registered Patient','patient',1],['special_filter','Doctor Specialisation','special'],['doctor_id','Doctor Name','doctorFee',1],['bill_date','OPD Bill Date','date',1],['doctor_fee','Doctor Fee','number'],['discount','Discount','number'],['tax','Tax','number'],['total','Total Amount','number'],['payment_mode','Mode of Payment','select:Cash|UPI|Card|Net Banking|Cheque|Other'],['paid','Amount of Payment','number'],['balance','Balance','number'],['status','Bill Status','select:Unpaid|Partial Paid|Paid'],['symptoms','Symptoms','textarea'],['diagnosis','Diagnosis','textarea'],['prescription','Prescription','textarea'],['advice','Advice','textarea'],['follow_up','Follow-up Date','date']]
};
function regVal(p,key){if(key==='registration_date')return (p.created_at||'').slice(0,10);if(key==='identity')return `${p.identity_type||''} ${p.identity_no||''}`;if(key==='mobile')return p.phone||'';return p[key]||''}
function regFiltered(){let arr=state.data.patients||[];let q=(state.q||'').toLowerCase().trim();let fs=state.regFilters||{};return arr.filter(p=>{let all=[p.registration_no,p.name,p.guardian_name,p.gender,p.age,p.phone,p.identity_type,p.identity_no,p.status,p.address,p.created_at].join(' ').toLowerCase();if(q && !all.includes(q))return false;return Object.entries(fs).every(([k,v])=>!v||String(regVal(p,k)).toLowerCase().includes(String(v).toLowerCase()))})}
function regRows(arr){if(!arr.length)return `<tr><td colspan="9"><div class="empty">No patient records found.</div></td></tr>`;return arr.map(p=>`<tr><td>${esc(p.registration_no)}</td><td>${esc(p.name)}</td><td>${esc(p.guardian_name)}</td><td>${esc(p.gender)}</td><td>${esc(p.age)}</td><td>${esc(p.phone)}</td><td>${esc(regVal(p,'identity'))}</td><td>${badge(p.status)}</td><td>${rowActions('patients',p.id)}</td></tr>`).join('')}
function regFilterInput(key,ph){return `<input style="margin-top:6px;padding:7px;font-size:12px" placeholder="Filter ${ph}" value="${esc(state.regFilters[key]||'')}" oninput="setRegFilter('${key}',this.value)" onclick="event.stopPropagation()">`}
function setRegFilter(key,value){state.regFilters[key]=value;applyRegFilters()}
function applyRegFilters(){let s=document.getElementById('regSearch');if(s)state.q=s.value;let arr=regFiltered();let body=document.getElementById('regBody');if(body)body.innerHTML=regRows(arr);let c=document.getElementById('regCount');if(c)c.textContent=arr.length+' patient(s) found'}
function clearRegFilters(){state.q='';state.regFilters={};renderRegistration()}
function renderRegistration(){let arr=regFiltered();content.innerHTML=`<div class="panel"><div class="toolbar"><div class="left"><input id="regSearch" class="search" placeholder="Search patient directory..." value="${esc(state.q)}" oninput="applyRegFilters()"><span id="regCount" class="muted">${arr.length} patient(s) found</span></div><div class="right"><button class="btn gray" onclick="clearRegFilters()">Clear Filters</button><button class="btn" onclick="openModal('patients')">+ New Registration</button><button class="btn secondary" onclick="exportCSV('patients')">Export Excel</button></div></div><h3>Patient Directory</h3><table><thead><tr><th>Reg. No${regFilterInput('registration_no','Reg. No')}</th><th>Name${regFilterInput('name','Name')}</th><th>Guardian${regFilterInput('guardian_name','Guardian')}</th><th>Gender${regFilterInput('gender','Gender')}</th><th>Age${regFilterInput('age','Age')}</th><th>Phone${regFilterInput('mobile','Phone')}</th><th>Identity${regFilterInput('identity','Identity')}</th><th>Status${regFilterInput('status','Status')}</th><th>Actions</th></tr></thead><tbody id="regBody">${regRows(arr)}</tbody></table></div>`}
function opdValue(b,key){if(key==='age_gender')return `${b.patient_age||''}/${b.patient_gender||''}`;if(key==='mobile')return b.patient_phone||'';if(key==='updated_on')return b.updated_at||b.created_at||'';if(key==='created_on')return b.created_at||'';return b[key]||''}
function opdFiltered(){let arr=state.data.opd_bills||[];let q=(state.q||'').toLowerCase().trim();let fs=state.opdFilters||{};return arr.filter(b=>{let all=[b.bill_no,b.registration_no,b.patient_name,b.patient_age,b.patient_gender,b.patient_phone,b.updated_at,b.created_at,b.bill_date,b.doctor_name,b.status].join(' ').toLowerCase();if(q && !all.includes(q))return false;return Object.entries(fs).every(([k,v])=>!v||String(opdValue(b,k)).toLowerCase().includes(String(v).toLowerCase()))})}
function opdRows(arr){if(!arr.length)return `<tr><td colspan="9"><div class="empty">No OPD billing records found.</div></td></tr>`;return arr.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.bill_no)}</td><td>${esc(b.registration_no)}</td><td>${esc(b.patient_name)}</td><td>${esc(opdValue(b,'age_gender'))}</td><td>${esc(opdValue(b,'mobile'))}</td><td>${esc(opdValue(b,'updated_on'))}</td><td>${esc(opdValue(b,'created_on'))}</td><td><button class="btn small green" onclick="printInvoice('${b.id}')">OPD Invoice</button> <button class="btn small secondary" onclick="printPrescription('${b.id}')">Prescription</button> ${rowActions('opd_bills',b.id)}</td></tr>`).join('')}

on><button class="${k==='departments'?'active':''}" onclick="state.admin='departments';state.q='';renderAdmin()">Departments</button><button class="${k==='users'?'active':''}" onclick="state.admin='users';state.q='';renderAdmin()">Users & Roles</button></div><div class="panel"><div class="toolbar"><div class="left">${searchBar('Search '+k+'...')}</div><div class="right">${addBtn}<button class="btn secondary" onclick="exportCSV('${k}')">Export Excel</button><button class="btn green" onclick="backupDB()">Backup DB</button></div></div>${k==='users'?'<p class="muted"><b>Admin Control:</b> assign role-based rights to employees/doctors/pharmacy users and reset passwords from here.</p>':''}${table(heads[k],rows[k])}</div></div>`}

e="button" class="btn" onclick="saveUserRole(modalForm)">Save User Rights</button></div>`;modal.classList.add('show')}

function calculatePatientAgeFromDob(){let dob=document.getElementById('dob'), age=document.getElementById('age');if(!dob||!age||!dob.value)return;let d=new Date(dob.value), t=new Date();let years=t.getFullYear()-d.getFullYear();let m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))years--;age.value=Math.max(0,years)}
function inputField(f,item){let [name,label,type,req]=f;if(name==='__legend')return `</div><fieldset class="fieldset"><legend>${label}</legend><div class="formgrid">`;let val=item?.[name]??def(name,type);let required=req?'required':'';if(type==='textarea')return `<label class="full">${label}<textarea name="${name}" ${required}>${esc(val)}</textarea></label>`;if(type?.startsWith('select:'))return `<label>${label}<select name="${name}" ${required}>${type.slice(7).split('|').map(x=>`<option ${x==val?'selected':''}>${x}</option>`).join('')}</select></label>`;if(type==='patient')return `<label>${label}<select name="${name}" ${required}>${state.data.patients.map(p=>`<option value="${p.id}" ${p.id==val?'selected':''}>${esc(p.registration_no)} - ${esc(p.name)} - ${esc(p.phone)}</option>`).join('')}</select></label>`;if(type==='doctor')return `<label>${label}<select name="${name}" ${required}>${state.data.doctors.filter(d=>d.status!=='Inactive').map(d=>`<option value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)} - ${esc(d.specialization)}</option>`).join('')}</select></label>`;if(type==='doctorFee')return `<label>${label}<select name="${name}" id="doctorSelect" ${required} onchange="fillFee()">${state.data.doctors.filter(d=>d.status!=='Inactive').map(d=>`<option data-fee="${d.fee||0}" value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)} - ${esc(d.specialization)} - ${money(d.fee)}</option>`).join('')}</select></label>`;if(type==='special')return `<label>${label}<select id="specialFilter" onchange="filterDoctors()"><option value="">All Specialisations</option>${[...new Set(state.data.doctors.map(d=>d.specialization).filter(Boolean))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>`;if(type==='department')return `<label>${label}<select name="${name}" onchange="setDeptName(this)"><option value="">Select Department</option>${state.data.departments.map(d=>`<option data-name="${esc(d.name)}" value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)}</option>`).join('')}</select><input type="hidden" name="department" value="${esc(item?.department||'')}"></label>`;if(type==='parentDepartment')return `<label>${label}<select name="${name}"><option value="">None</option>${state.data.departments.map(d=>`<option value="${d.id}" ${d.id==val?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`;return `<label>${label}<input name="${name}" id="${name}" type="${type}" value="${esc(val)}" ${name==='dob'?'onchange="calculatePatientAgeFromDob()" oninput="calculatePatientAgeFromDob()"':''} ${required}></label>`}

rEach(id=>{let el=document.getElementById(id); if(el)el.oninput=calcBill});}}

function rupeeWords(num){num=Math.round(Number(num||0));if(num===0)return 'Zero Rupees Only';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];function w(n){if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');if(n<1000)return a[Math.floor(n/100)]+' Hundred'+(n%100?' '+w(n%100):'');return ''}let parts=[];let crore=Math.floor(num/10000000);num%=10000000;let lakh=Math.floor(num/100000);num%=100000;let thousand=Math.floor(num/1000);num%=1000;if(crore)parts.push(w(crore)+' Crore');if(lakh)parts.push(w(lakh)+' Lakh');if(thousand)parts.push(w(thousand)+' Thousand');if(num)parts.push(w(num));return (parts.join(' ')||'Zero')+' Rupees Only'}
function pharmacyInvoicePrintDoc(inv,items){items=items||[];let subtotal=Number(inv.subtotal||0),gst=Number(inv.gst_amount||0),grand=Math.round(Number(inv.grand_total||subtotal+gst||0)),received=Number(inv.received||inv.payment||0);let rows=items.map((r,i)=>{let qty=Number(r.qty||r.quantity||0),mrp=Number(r.rate||r.mrp||r.selling_price||0),amt=Number(r.total||qty*mrp*1.05);return `<tr><td>${i+1}</td><td>${esc(r.medicine_name||r.medicine||'')}</td><td>${esc(r.batch_no||r.batch||'')}</td><td>${qty}</td><td>₹ ${mrp.toFixed(2)}</td><td>${r.cgst||2.5}</td><td>${r.sgst||2.5}</td><td>₹ ${amt.toFixed(2)}</td></tr>`}).join('')||`<tr><td colspan="8" style="height:90px"></td></tr>`;let html=`<!doctype html><html><head><title>Pharmacy Tax Invoice</title><style>@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#111;font-size:12px}.invoice{width:100%;border:1px solid #111;min-height:96vh;padding:12px 14px;position:relative}.top{position:relative;text-align:center;border-bottom:1px solid #111;padding-bottom:7px}.shop{font-weight:900;font-size:18px;letter-spacing:.3px}.addr{font-size:11px;margin-top:3px}.phone{font-size:11px;margin-top:3px}.tax{position:absolute;right:0;top:0;border:1px solid #111;padding:5px 12px;font-weight:900;font-size:13px}.reg{margin-top:6px;text-align:left;font-weight:bold}.info{width:100%;border-collapse:collapse;margin-top:10px}.info td{border:0;padding:3px 4px}.items{width:100%;border-collapse:collapse;margin-top:12px}.items th{border:1px solid #111;background:#f1f5f9;padding:7px 4px;text-align:center;font-size:11px}.items td{border:1px solid #111;padding:7px 4px;text-align:center}.items td:nth-child(2){text-align:left}.bottom{display:grid;grid-template-columns:1.35fr .75fr;gap:12px;margin-top:12px}.terms{border-top:1px solid #111;padding-top:8px;min-height:130px}.summary{width:100%;border-collapse:collapse}.summary td{border:1px solid #111;padding:8px}.summary td:last-child{text-align:right;font-weight:bold}.grand td{font-size:14px;font-weight:900}.signs{display:grid;grid-template-columns:1fr 1fr;margin-top:55px;align-items:end}.right{text-align:right}.bold{font-weight:bold}.words{margin-top:8px}.muted{font-size:11px}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="invoice"><div class="top"><div class="tax">TAX INVOICE</div><div class="shop">MAHAVEER HEALTHCARE & MEDICOS PHARMACY</div><div class="addr">Contractor Colony, G.E. Road, Supela, Dist. Durg, Bhilai, Chhattisgarh, 490023</div><div class="phone">Phone: +91 8871747174 &nbsp;&nbsp; Tel: 07884107881</div><div class="reg">REGN. NO: ${esc(inv.registration_no||'')}</div></div><table class="info"><tr><td class="bold">Invoice No</td><td>: ${esc(inv.invoice_no||nextPhInvoiceNo())}</td><td class="bold">Date</td><td>: ${esc(inv.order_date||new Date().toISOString().slice(0,10))}</td></tr><tr><td class="bold">Payment Mode</td><td>: ${esc(inv.payment_method||'Cash')}</td><td class="bold">Customer</td><td>: ${esc(inv.customer_name||'Walk-in Customer')}</td></tr><tr><td class="bold">Contact</td><td>: ${esc(inv.contact||'')}</td><td class="bold">Status</td><td>: ${esc(inv.payment_status||'')}</td></tr></table><table class="items"><thead><tr><th>S.No</th><th>PRODUCT</th><th>BATCH</th><th>QTY</th><th>MRP (₹)</th><th>CGST%</th><th>SGST%</th><th>AMOUNT (₹)</th></tr></thead><tbody>${rows}</tbody></table><div class="bottom"><div><div class="words"><span class="bold">Amount in words:</span> ${rupeeWords(grand)}</div><div class="terms"><div class="bold">Terms & Conditions:</div><div>1. Goods once sold will not be taken back or exchanged.</div><div>2. Subject to local jurisdiction only.</div></div></div><table class="summary"><tr><td>Sub Total</td><td>₹ ${subtotal.toFixed(2)}</td></tr><tr class="grand"><td>GRAND TOTAL</td><td>₹ ${grand.toFixed(2)}</td></tr><tr><td>Received</td><td>₹ ${received.toFixed(2)}</td></tr></table></div><div class="signs"><div>Receiver's Signature</div><div class="right">For Mahaveer Healthcare & Medicose Pharmacy<br><br><br><span class="bold">Authorised Signatory</span></div></div></div><script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close()}

function bars(rows,label='date',val='total'){let max=Math.max(1,...(rows||[]).map(x=>+x[val]||0));return `<div style="display:grid;gap:8px">${(rows||[]).map(x=>`<div><b>${esc(x[label])}</b><div style="height:14px;background:#e0f2fe;border-radius:99px"><div style="height:14px;width:${((+x[val]||0)/max*100).toFixed(0)}%;background:#2563eb;border-radius:99px"></div></div><small>${money(x[val])}</small></div>`).join('')||'<div class="empty">No graph data.</div>'}</div>`}

async function renderPharmacyDashboard(){let d=await fetch(API+'pharmacy_dashboard?date='+state.date).then(r=>r.json());content.innerHTML=`<div class="toolbar"><div></div><div class="right"><button class="btn" onclick="show('pharmacy_invoice')">+ New Invoice</button><button class="btn secondary" onclick="show('pharmacy_stock_in')">+ Stock Inward</button></div></div><div class="cards"><div class="card"><span>Today’s Revenue</span><b>${money(d.today_revenue)}</b></div><div class="card"><span>Today’s Refund</span><b>${money(d.today_refund)}</b></div><div class="card"><span>Active Invoices</span><b>${d.active_invoices}</b></div><div class="card"><span>Low Stock Items</span><b>${d.low_stock_items}</b></div><div class="card"><span>Soon to Expire</span><b>${d.soon_to_expire}</b></div></div><div class="grid2"><div class="panel"><div class="toolbar"><h3>Weekly Sales Trends</h3><button class="btn small secondary" onclick="show('pharmacy_reports')">View Report</button></div>${bars(d.weekly_sales)}</div><div class="panel"><h3>Low Stock by Category</h3>${pieList(d.low_stock_by_category)}</div></div><div class="panel"><h3>Recent Invoices</h3>${table(['Invoice','Date','Customer','Amount','Status'],(d.recent_invoices||[]).map(x=>[esc(x.invoice_no),esc(x.order_date),esc(x.customer_name),money(x.grand_total),badge(x.payment_status)]))}</div><div class="panel"><h3>Alerts and Notifications</h3>${table(['Medicine','Batch','Qty','Expiry','Category'],(d.alerts||[]).map(x=>[esc(x.medicine_name),esc(x.batch_no),esc(x.quantity),esc(x.expiry_date),esc(x.category)]))}</div>`}
function nextPhInvoiceNo(){let y=new Date().getFullYear(), nums=(state.data.pharmacy_invoices||[]).map(i=>String(i.invoice_no||'')).filter(x=>x.startsWith('PHINV-'+y+'-')).map(x=>+x.split('-').pop()||0);return `PHINV-${y}-${String((Math.max(0,...nums)+1)).padStart(5,'0')}`}
function parsePrescriptionMedicines(text){return String(text||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean).map(line=>{let clean=line.replace(/^[-•\d\.\)\s]+/,'').trim();let parts=clean.split(/\s+-\s+|\s+for\s+/i);let med=(parts[0]||clean).trim();let days='';let m=clean.match(/(\d+)\s*day/i);if(m)days=m[1];return {medicine_name:med,days,source_line:clean}}).filter(x=>x.medicine_name)}
function stockForMedicine(name){let n=String(name||'').toLowerCase();return (state.data.pharmacy_stock_items||[]).find(x=>String(x.medicine_name||'').toLowerCase()===n&&+x.quantity>0)||(state.data.pharmacy_stock_items||[]).find(x=>String(x.medicine_name||'').toLowerCase()===n)||(state.data.pharmacy_stock_items||[]).find(x=>n && String(x.medicine_name||'').toLowerCase().includes(n))}
function loadOpdPrescriptionForPatient(patientId){let bills=(state.data.opd_bills||[]).filter(b=>b.patient_id===patientId && String(b.prescription||'').trim()).sort((a,b)=>String(b.bill_date||b.created_at).localeCompare(String(a.bill_date||a.created_at)));let latest=bills[0];if(!latest)return;let meds=parsePrescriptionMedicines(latest.prescription);if(!meds.length)return;state.phRows=meds.map(m=>{let st=stockForMedicine(m.medicine_name);return {medicine_name:st?.medicine_name||m.medicine_name,batch_no:st?.batch_no||'',expiry_date:st?.expiry_date||'',qty:1,rate:Number(st?.mrp||st?.selling_price||0),cgst:2.5,sgst:2.5,days:m.days,opd_bill_no:latest.bill_no}});}

function filterPhPatients(q){let sel=document.getElementById('phPatient');if(!sel)return;let cur=sel.value, term=(q||'').toLowerCase();let pts=state.data.patients.filter(p=>[p.registration_no,p.name,p.phone].join(' ').toLowerCase().includes(term));sel.innerHTML='<option value="">Walk-in / no registration</option>'+pts.map(p=>`<option value="${p.id}">${esc(p.registration_no)} - ${esc(p.name)} - ${esc(p.phone)}</option>`).join('');sel.value=pts.find(p=>p.id===cur)?cur:''}

function renderPhRows(){let body=state.phRows.map((r,i)=>`<tr><td>${i+1}</td><td><input list="medlist" value="${esc(r.medicine_name||'')}" oninput="phRow(${i},'medicine_name',this.value)" onchange="selectMedicineForRow(${i},this.value)"><small>Batch: ${esc(r.batch_no||'')} Exp: ${esc(r.expiry_date||'')} ${r.days?('| Days: '+esc(r.days)):''} ${r.opd_bill_no?('| OPD: '+esc(r.opd_bill_no)):''}</small></td><td><input type="number" min="0" step="1" value="${r.qty??1}" oninput="phRow(${i},'qty',this.value);updatePhTotals()"></td><td><input type="number" min="0" step="0.01" value="${r.rate??0}" oninput="phRow(${i},'rate',this.value);updatePhTotals()"></td><td>2.5%</td><td>2.5%</td><td class="phLineTotal">${money((+r.qty||0)*(+r.rate||0)*1.05)}</td><td><button class="btn small red" onclick="state.phRows.splice(${i},1);renderPharmacyInvoice()">Cancel</button></td></tr>`).join('');return `<datalist id="medlist">${medicineOptions()}</datalist><table><thead><tr><th>S.No</th><th>Medicine / Batch / Expiry</th><th>Qty</th><th>Rate</th><th>CGST</th><th>SGST</th><th>Total</th><th>Actions</th></tr></thead><tbody>${body}</tbody></table>`}
function selectMedicineForRow(i,name){let lot=state.data.pharmacy_stock_items.find(x=>x.medicine_name===name&&+x.quantity>0)||state.data.pharmacy_stock_items.find(x=>x.medicine_name===name);if(lot){state.phRows[i].medicine_name=name;state.phRows[i].batch_no=lot.batch_no;state.phRows[i].expiry_date=lot.expiry_date;state.phRows[i].rate=Number(lot.mrp||lot.selling_price||0)}renderPharmacyInvoice()}
function updatePhTotals(){let sm=phSummary();document.querySelectorAll('.phLineTotal').forEach((el,i)=>{let r=state.phRows[i];el.textContent=money((+r.qty||0)*(+r.rate||0)*1.05)});['sumQty','sumSub','sumGst','sumGrand'].forEach(id=>{});let q=document.getElementById('sumQty'),su=document.getElementById('sumSub'),g=document.getElementById('sumGst'),gr=document.getElementById('sumGrand'),rem=document.getElementById('phRemaining');if(q)q.textContent=sm.qty;if(su)su.textContent=money(sm.sub);if(g)g.textContent=money(sm.gst);if(gr)gr.textContent=money(sm.grand);if(rem)rem.value=Math.round(sm.rem)}

function phSummary(){let qty=0,sub=0,gst=0;state.phRows.forEach(r=>{let b=(+r.qty||0)*(+r.rate||0);qty+=+r.qty||0;sub+=b;gst+=b*.05});let disc=+document.getElementById('phDisc')?.value||0,pay=(document.getElementById('phPay')?+document.getElementById('phPay').value:+state.phCustomer.payment)||0,grand=Math.round(Math.max(0,sub-sub*disc/100+gst));let oldInv=state.phEditId?state.data.pharmacy_invoices.find(x=>x.id===state.phEditId):null;let oldReceived=oldInv?+(oldInv.received||0):0;let dueBefore=oldInv?Math.round(Math.max(0,grand-oldReceived)):grand;let rem=Math.round(Math.max(0,dueBefore-pay));return {qty,sub,gst,disc,grand,pay,oldReceived,dueBefore,rem}}
function renderPharmacyInvoice(){if(!state.phRows.length)state.phRows=[{qty:1,rate:0,cgst:2.5,sgst:2.5}];let sm=phSummary();let invNo=state.phEditId?(state.data.pharmacy_invoices.find(x=>x.id===state.phEditId)?.invoice_no||'Auto'):nextPhInvoiceNo();let invDate=new Date().toISOString().slice(0,10);content.innerHTML=`<div class="panel"><div class="toolbar"><h3>Create Pharmacy Tax Invoice</h3><div class="right"><button class="btn green" onclick="printPhInvoice()">Print Invoice</button><button class="btn" onclick="savePhInvoice()">Save Invoice</button><button class="btn secondary" onclick="exportCSV('pharmacy_invoices')">Export to Excel</button></div></div><fieldset class="fieldset"><legend>Customer Information</legend><div class="formgrid"><label>Registration Number Filter${phPatientSelect()}<input style="margin-top:8px" placeholder="Search registered patient by name / registration / mobile" oninput="filterPhPatients(this.value)"><small class="muted">After selecting a registered patient, latest OPD prescription medicines auto-load below.</small></label><label>Invoice Number<input value="${esc(invNo)}" readonly></label><label>Invoice Date<input value="${esc(invDate)}" readonly></label><label>Registration No<input id="phReg" value="${esc(state.phCustomer.registration_no)}" oninput="state.phCustomer.registration_no=this.value"></label><label>Name<input id="phName" value="${esc(state.phCustomer.customer_name)}" oninput="state.phCustomer.customer_name=this.value" required></label><label>Contact Number<input id="phContact" value="${esc(state.phCustomer.contact)}" oninput="state.phCustomer.contact=this.value"></label><label>Payment Status<select id="phStatus" onchange="state.phCustomer.payment_status=this.value"><option ${state.phCustomer.payment_status==='Auto'?'selected':''}>Auto</option><option ${state.phCustomer.payment_status==='Draft'?'selected':''}>Draft</option><option ${state.phCustomer.payment_status==='Paid'?'selected':''}>Paid</option><option ${state.phCustomer.payment_status==='Pending'?'selected':''}>Pending</option><option ${state.phCustomer.payment_status==='Partial'?'selected':''}>Partial</option></select></label><label>Payment Method<select id="phMethod" onchange="state.phCustomer.payment_method=this.value"><option ${state.phCustomer.payment_method==='Cash'?'selected':''}>Cash</option><option ${state.phCustomer.payment_method==='Card'?'selected':''}>Card</option><option ${state.phCustomer.payment_method==='UPI'?'selected':''}>UPI</option><option ${state.phCustomer.payment_method==='Bank Transfer'?'selected':''}>Bank Transfer</option></select></label></div></fieldset><div class="toolbar"><h3>Medicine Items</h3><div><button class="btn small green" onclick="openDrugPopup()">+ Add New Drug</button> <button class="btn secondary" onclick="state.phRows.push({qty:1,rate:0,cgst:2.5,sgst:2.5});renderPharmacyInvoice()">+ Add Row</button></div></div>${renderPhRows()}<fieldset class="fieldset"><legend>Billing Summary</legend><div class="cards"><div class="card"><span>Total Qty</span><b id="sumQty">${sm.qty}</b></div><div class="card"><span>Subtotal</span><b id="sumSub">${money(sm.sub)}</b></div><div class="card"><span>GST</span><b id="sumGst">${money(sm.gst)}</b></div><div class="card"><span>Grand Total</span><b id="sumGrand">${money(sm.grand)}</b></div></div><div class="formgrid"><label>Discount %<input id="phDisc" type="number" value="${sm.disc}" oninput="updatePhTotals()"></label><label>${state.phEditId?'Payment Received / Collect Now':'Payment Received'}<input id="phPay" type="number" value="${sm.pay}" oninput="state.phCustomer.payment=+this.value||0;updatePhTotals()"></label><label>Payment Method<input value="${esc(state.phCustomer.payment_method||'Cash')}" readonly></label><label>${state.phEditId?'Remaining After Payment':'Remaining'}<input id="phRemaining" value="${Math.round(sm.rem)}" readonly></label></div></fieldset></div>`}
function openDrugPopup(){let html=`<div class="modal show" id="drugModal"><div class="dialog" style="width:min(560px,100%)"><header><h3>Add New Drug</h3><button class="btn gray" onclick="drugModal.remove()">Close</button></header><div style="padding:22px" class="formgrid"><label>Drug Name<input id="drugName"></label><label>Generic Name<input id="drugGeneric"></label><label>Category<select id="drugCat"><option>Tablet</option><option>Capsule</option><option>Syrup</option><option>Injection</option><option>Ointment</option><option>Drops</option><option>Inhaler</option><option>Other</option></select></label><label>Manufacturer<input id="drugMfg"></label><label>HSN Code<input id="drugHsn"></label><div class="full actions"><button class="btn gray" onclick="drugModal.remove()">Cancel</button><button class="btn" onclick="saveNewDrug()">Add Drug</button></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}
async function saveNewDrug(){let name=drugName.value.trim();if(!name)return alert('Drug Name required');let data={medicine_name:name,category:drugCat.value,batch_no:'NEW',quantity:0,original_qty:0,cost_per_qty:0,selling_price:0,mrp:0,hsn:drugHsn.value,cgst:2.5,sgst:2.5,expiry_date:'',supplier_name:drugMfg.value};let r=await fetch(API+'pharmacy_stock_items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)return alert('Unable to add drug');drugModal.remove();await phRefresh();renderPharmacyInvoice();alert('Drug added and reflected in Stock Inventory')}
async function savePhInvoice(){let sm=phSummary();let oldInv=state.phEditId?state.data.pharmacy_invoices.find(x=>x.id===state.phEditId):null;let finalPayment=sm.pay;if(oldInv){let oldReceived=+(oldInv.received||0); finalPayment=oldReceived+sm.pay;}let data={invoice_no:oldInv?.invoice_no,patient_id:state.phCustomer.patient_id,registration_no:state.phCustomer.registration_no,customer_name:state.phCustomer.customer_name||'Walk-in Customer',contact:state.phCustomer.contact,order_date:oldInv?.order_date||new Date().toISOString().slice(0,10),payment_status:state.phCustomer.payment_status,payment_method:state.phCustomer.payment_method,items:state.phRows,discount_percent:sm.disc,payment:finalPayment};let url=API+'pharmacy_invoices'+(state.phEditId?'/'+state.phEditId:'');let r=await fetch(url,{method:state.phEditId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let out=await r.json();if(!r.ok)return alert(out.error||'Save failed');alert(state.phEditId?'Invoice updated':'Invoice saved: '+out.invoice_no);state.phRows=[];state.phEditId='';state.phCustomer={patient_id:'',registration_no:'',customer_name:'',contact:'',payment_status:'Auto',payment_method:'Cash',payment:0};await load();show('pharmacy_sales')}
function printPhInvoice(){let sm=phSummary();let inv={invoice_no:state.phEditId?(state.data.pharmacy_invoices.find(x=>x.id===state.phEditId)?.invoice_no||nextPhInvoiceNo()):nextPhInvoiceNo(),order_date:new Date().toISOString().slice(0,10),payment_method:state.phCustomer.payment_method||'Cash',customer_name:state.phCustomer.customer_name||'Walk-in Customer',contact:state.phCustomer.contact||'',payment_status:state.phCustomer.payment_status||'Auto',registration_no:state.phCustomer.registration_no||'',subtotal:sm.sub,gst_amount:sm.gst,grand_total:sm.grand,received:sm.pay};pharmacyInvoicePrintDoc(inv,state.phRows)}
function renderPharmacySales(){let arr=filter(state.data.pharmacy_invoices);let total=arr.length,rev=arr.reduce((a,x)=>a+(+x.grand_total||0),0),paid=arr.filter(x=>x.payment_status==='Paid').length,draft=arr.filter(x=>x.payment_status==='Draft').length;content.innerHTML=`<div class="cards"><div class="card"><span>Total Invoices</span><b>${total}</b></div><div class="card"><span>Total Revenue</span><b>${money(rev)}</b></div><div class="card"><span>Paid</span><b>${paid}</b></div><div class="card"><span>Draft</span><b>${draft}</b></div></div><div class="panel"><div class="toolbar">${searchBar('Filter by Patient Name / Status / Date...')}<button class="btn" onclick="show('pharmacy_invoice')">+ New Invoice</button></div>${table(['S.No','Invoice No','Order Date','Customer Name','Contact','Amount','Payment Status','Actions'],arr.map((x,i)=>[i+1,esc(x.invoice_no),esc(x.order_date),esc(x.customer_name),esc(x.contact),money(x.grand_total),badge(x.payment_status),`<button class="btn small secondary" onclick="printSavedPh('${x.id}')">Print</button> <button class="btn small secondary" onclick="editPhInvoice('${x.id}')">Edit</button> <button class="btn small red" onclick="del('pharmacy_invoices','${x.id}')">Delete/Cancel</button>`]))}</div>`}
function printSavedPh(id){let inv=state.data.pharmacy_invoices.find(x=>x.id===id);let items=[];try{items=JSON.parse(inv.items||'[]')}catch(e){}pharmacyInvoicePrintDoc(inv,items)}
function editPhInvoice(id){let inv=state.data.pharmacy_invoices.find(x=>x.id===id);if(!inv)return;state.phEditId=id;state.phCustomer={patient_id:inv.patient_id||'',registration_no:inv.registration_no||'',customer_name:inv.customer_name||'',contact:inv.contact||'',payment_status:inv.payment_status||'Auto',payment_method:inv.payment_method||'Cash',payment:+(inv.remaining||0)};try{state.phRows=JSON.parse(inv.items||'[]')}catch(e){state.phRows=[]}show('pharmacy_invoice')}
function renderPharmacyPO(){let arr=state.data.pharmacy_stock_items;let pos=[...new Set(arr.map(x=>x.po_no).filter(Boolean))];content.innerHTML=`<div class="toolbar"><h3>Purchase Orders</h3><button class="btn" onclick="show('pharmacy_stock_in')">+ Create New PO</button></div><div class="cards"><div class="card"><span>Total Orders</span><b>${pos.length}</b></div><div class="card"><span>Active Orders</span><b>${pos.length}</b></div><div class="card"><span>Added to Stock</span><b>${pos.length}</b></div><div class="card"><span>Draft Orders</span><b>0</b></div></div><div class="panel">${table(['PO No','Invoice No','Supplier','Items','Status'],pos.map(po=>{let rows=arr.filter(x=>x.po_no===po);return [esc(po),esc(rows[0]?.invoice_ref),esc(rows[0]?.supplier_name),rows.length,badge('Added to Stock')]}))}</div>`}

function renderStockIn(){if(!state.stockRows.length)state.stockRows=[{category:'Tablet',cgst:2.5,sgst:2.5}];content.innerHTML=`<div class="panel"><div class="toolbar"><h3>Add Stock / Stock Inward</h3><div><button class="btn gray" onclick="printContent()">Print</button><button class="btn secondary" onclick="saveStock('Draft')">Save Draft</button><button class="btn" onclick="saveStock('Confirmed')">Confirm & Add Stock</button></div></div><div class="grid2"><div><h3>Medicine Line Items</h3>${state.stockRows.map((r,i)=>stockLine(i,r)).join('')}<button class="btn secondary" onclick="state.stockRows.push({category:'Tablet',cgst:2.5,sgst:2.5});renderStockIn()">+ Add Another Medicine</button></div><div><fieldset class="fieldset"><legend>Supplier Information</legend><label>Supplier Name<select id="stockSupplier"><option value="">Select / Add New Supplier in Master</option>${state.data.pharma_suppliers.map(s=>`<option value="${s.id}">${esc(s.supplier_name)}</option>`).join('')}</select></label><br><br><label>Invoice/Reference No<input id="stockRef"></label><br><br><label>Payment Status<select id="stockPay"><option>Pending</option><option>Paid</option><option>Partial</option></select></label><h3>Order Summary</h3><p class="muted">Total Base Amount, Applicable GST and Grand Total are calculated accurately when saved.</p><button class="btn green" onclick="saveStock('Confirmed')">Complete Stock Inward</button></fieldset></div></div></div>`}

function inventoryFiltered(){let q=(document.getElementById('inventorySearch')?.value||state.q||'').toLowerCase().trim();let arr=state.data.pharmacy_stock_items||[];if(!q)return arr;return arr.filter(x=>[x.medicine_name,x.category,x.batch_no,x.quantity,x.po_no,x.invoice_ref,x.expiry_date,x.supplier_name,x.cost_per_qty,x.selling_price,x.mrp].join(' ').toLowerCase().includes(q))}
function inventoryRows(arr){if(!arr.length)return `<tr><td colspan="14"><div class="empty">No stock inventory records found.</div></td></tr>`;return arr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.medicine_name)}</td><td>${money(x.cost_per_qty)}</td><td>${money(x.selling_price)}</td><td>${money(x.mrp)}</td><td>${esc(x.batch_no)}</td><td>${esc(x.quantity)}</td><td>${esc(x.po_no)}</td><td>${esc(x.invoice_ref)}</td><td>${esc(x.expiry_date)}</td><td>${esc(x.category)}</td><td>${esc(x.supplier_name)}</td><td>${esc('Inward '+x.created_at)}</td><td>${state.user?.role==='admin'?`<button class="btn small secondary" onclick="editInventoryItem('${x.id}')">Edit</button>`:''}</td></tr>`).join('')}

function renderInventory(){let arr=inventoryFiltered();let all=state.data.pharmacy_stock_items||[];let low=all.filter(x=>+x.quantity>0&&+x.quantity<=10).length,out=all.filter(x=>+x.quantity<=0).length,soon=all.filter(x=>x.expiry_date && x.expiry_date<=new Date(Date.now()+60*864e5).toISOString().slice(0,10)).length;content.innerHTML=`<div class="toolbar"><h3>Stock Inventory</h3><div><button class="btn gray" onclick="printContent()">Print</button><button class="btn secondary" onclick="exportCSV('pharmacy_stock_items')">Export to Excel</button><button class="btn green" onclick="downloadStockTemplate()">Download Here</button><button class="btn" onclick="stockImportFile.click()">Import</button><input id="stockImportFile" type="file" accept=".csv,.txt" style="display:none" onchange="importStockFile(this.files[0])"></div></div><div class="cards"><div class="card"><span>Total Items</span><b>${all.length}</b></div><div class="card"><span>Low Stock</span><b>${low}</b></div><div class="card"><span>Out of Stock</span><b>${out}</b></div><div class="card"><span>Expiring Soon</span><b>${soon}</b></div></div><div class="panel"><div class="toolbar"><div class="left"><input id="inventorySearch" class="search" placeholder="Search by Medicine Name, Batch, Category, Supplier, PO, Invoice, Price..." value="${esc(state.q||'')}" oninput="applyInventoryFilter()"><span id="inventoryCount" class="muted">${arr.length} item(s) found</span></div></div><table><thead><tr><th>S.No</th><th>Item</th><th>Cost per Qty</th><th>Selling Price</th><th>MRP</th><th>Batch</th><th>Quantity</th><th>PO No.</th><th>Invoice No.</th><th>Expiry Date</th><th>Category</th><th>Supplier</th><th>History</th><th>${state.user?.role==='admin'?'Action':''}</th></tr></thead><tbody id="inventoryBody">${inventoryRows(arr)}</tbody></table></div>`}
function editInventoryItem(id){if(state.user?.role!=='admin')return alert('Only admin can edit stock item prices');let x=(state.data.pharmacy_stock_items||[]).find(i=>i.id===id);if(!x)return alert('Stock item not found');modal.dataset.kind='inventory_price_edit';modal.dataset.id=id;modalTitle.textContent='Edit Stock Item';modalForm.innerHTML=`<div class="formgrid"><label>Medicine Name<input name="medicine_name" value="${esc(x.medicine_name||'')}" required></label><label>Cost per Qty<input name="cost_per_qty" type="number" step="0.01" value="${esc(x.cost_per_qty||0)}"></label><label>Selling Price<input name="selling_price" type="number" step="0.01" value="${esc(x.selling_price||0)}"></label><label>MRP<input name="mrp" type="number" step="0.01" value="${esc(x.mrp||0)}"></label><div class="full empty"><b>Note:</b> Only Medicine Name, Cost per Qty, Selling Price and MRP are editable here. Batch, quantity, expiry, supplier and other stock fields cannot be edited from this option.</div></div><div class="actions"><button type="button" class="btn gray" onclick="closeModal()">Cancel</button><button type="button" class="btn" onclick="saveInventoryEdit()">Save Changes</button></div>`;modal.classList.add('show')}
async function saveInventoryEdit(){let id=modal.dataset.id;let data=Object.fromEntries(new FormData(modalForm).entries());data.cost_per_qty=Number(data.cost_per_qty||0);data.selling_price=Number(data.selling_price||0);data.mrp=Number(data.mrp||0);let res=await fetch(API+'pharmacy_stock_items/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let out=await res.json();if(!res.ok)return alert(out.error||'Unable to update stock item');closeModal();await load();show('pharmacy_inventory')}
function downloadStockTemplate(){let cols=['medicine_name','category','batch_no','quantity','cost_per_qty','selling_price','mrp','hsn','cgst','sgst','expiry_date','supplier_name','invoice_ref','po_no'];let csv=cols.join(',')+'\nParacetamol 500,Tablet,BATCH001,100,2,5,6,3004,2.5,2.5,2027-12-31,Sample Supplier,INV001,PO001';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stock_import_template.csv';a.click()}
function parseCSV(text){let lines=text.trim().split(/\r?\n/);let heads=lines.shift().split(',').map(x=>x.trim());return lines.filter(Boolean).map(line=>{let vals=line.split(',');let o={};heads.forEach((h,i)=>o[h]=vals[i]?.trim()||'');return o})}
async function importStockFile(file){if(!file)return;let text=await file.text();let rows=parseCSV(text);if(!rows.length)return alert('No rows found');for(const r of rows){let data={medicine_name:r.medicine_name,category:r.category||'Tablet',batch_no:r.batch_no,quantity:+r.quantity||0,original_qty:+r.quantity||0,cost_per_qty:+r.cost_per_qty||0,selling_price:+r.selling_price||0,mrp:+r.mrp||0,hsn:r.hsn||'',cgst:+r.cgst||2.5,sgst:+r.sgst||2.5,expiry_date:r.expiry_date||'',supplier_name:r.supplier_name||'',invoice_ref:r.invoice_ref||'',po_no:r.po_no||''};await fetch(API+'pharmacy_stock_items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}await load();show('pharmacy_inventory');alert('Stock imported successfully')}
async function renderPharmacyReturns(){let arr=filter(state.data.pharmacy_returns);let refund=arr.reduce((a,x)=>a+(+x.refund_amount||0),0);content.innerHTML=`<div class="toolbar"><h3>Return Medicine</h3><button class="btn" onclick="createReturnForm()">+ Create Return Request</button></div><div class="cards"><div class="card"><span>Total Return</span><b>${arr.length}</b></div><div class="card"><span>Total Refund</span><b>${money(refund)}</b></div><div class="card"><span>Pending</span><b>${arr.filter(x=>x.refund_status!=='Paid').length}</b></div><div class="card"><span>Paid</span><b>${arr.filter(x=>x.refund_status==='Paid').length}</b></div></div><div class="panel">${table(['S.No','Return No','Invoice No','Order Date','Name','Return Date','Contact','Refund Amount','Status','Actions'],arr.map((x,i)=>[i+1,esc(x.return_no),esc(x.invoice_no),esc(x.invoice_date),esc(x.customer_name),esc(x.return_date),esc(x.contact),money(x.refund_amount),badge(x.status),`<button class="btn small secondary" onclick="viewReturnInvoice('${x.id}')">View</button> <button class="btn small green" onclick="markReturnPaid('${x.id}')">Mark Paid & Restore</button>`]))}</div>`}

function printReturnInvoice(id){

async function saveReturn(){let inv=state.data.pharmacy_invoices.find(x=>x.id===retInv.value),c=calcRet();if(!inv)return alert('Select invoice');let data={invoice_id:inv.id,invoice_no:inv.invoice_no,invoice_date:inv.order_date,status:retStatus.value,customer_name:inv.customer_name,contact:inv.contact,notes:retNotes.value,items:state.returnRows,subtotal:c.sub,discount_percent:c.disc,gst_amount:c.gst,refund_amount:c.total,return_date:new Date().toISOString().slice(0,10)};let r=await fetch(API+'pharmacy_returns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let out=await r.json();if(!r.ok)return alert('Save failed');if(data.status==='Refunded'){await fetch(API+'pharmacy_returns/'+out.id+'/mark_paid',{method:'PUT'})}await load();show('pharmacy_returns')}

let loginParticlesStarted=false;
function startLoginParticles(){
  if(loginParticlesStarted) return; loginParticlesStarted=true;
  const canvas=document.getElementById('loginParticles'); if(!canvas) return;
  const ctx=canvas.getContext('2d'); let W=0,H=0,pts=[];
  function size(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;pts=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*2+1}))}
  function draw(){ctx.clearRect(0,0,W,H);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(103,232,249,.55)';ctx.fill()}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){let a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(103,232,249,${(1-d/120)*.18})`;ctx.stroke()}}}requestAnimationFrame(draw)}
  window.addEventListener('resize',size); size(); draw();
}

function downloadCSV(name,rows){if(!rows.length){alert('No data to export');return}let keys=[...new Set(rows.flatMap(o=>Object.keys(o)))];let csv=[keys.join(',')].concat(rows.map(o=>keys.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(','))).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}

// Global Enter behavior: pressing Enter inside any input/select/textarea removes focus instead of submitting/changing sections.
document.addEventListener('keydown', function(e){
  const el = e.target;
  if(e.key === 'Enter' && el && el.matches && el.matches('input, select, textarea')){
    // Login form should submit on Enter.
    if(el.closest && el.closest('#loginForm')) return;
    e.preventDefault();
    el.blur();
  }
}, true);
